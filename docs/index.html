<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Macroxel — Visor de Ventas Farmacia</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#eaf7ff;font-family:Arial,Helvetica,sans-serif}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .fallback{position:fixed;inset:auto 16px 16px;z-index:2;padding:10px 14px;border-radius:12px;background:#0c4f82;color:#fff;text-decoration:none;font-weight:800;box-shadow:0 8px 24px #002b5040}
  </style>
</head>
<body>
  <iframe id="visor" title="Macroxel — Visor de Ventas Farmacia" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <a id="fallback" class="fallback" href="/Sistema-De-Ventas-Farmacias/">Abrir visor central</a>
  <script>
    (() => {
      const central = location.origin + '/Sistema-De-Ventas-Farmacias/';
      const suffix = (location.search || '') + (location.hash || '');
      const target = central + suffix;
      document.getElementById('visor').src = target;
      document.getElementById('fallback').href = target;
    })();
  </script>
</body>
</html>
